releaseName: KenSei Studio 0.4.0
releaseNotes: >
  ADDED

  - Right-click prop and song management, including duplicate, reorder, clear
  and delete.

  - Per-song preview volume and mute, plus a persistent App master volume.

  - Eight offline lighting algorithms and 24 searchable Arctic, Neon and Ember
  presets.


  IMPROVED

  - Copy all song tracks when duplicating a prop, with fresh IDs and GPIO
  reconfirmation.

  - Volume changes keep preview playback and lighting in sync without
  invalidating firmware builds.


  FIXED

  - Share audio assets when duplicating songs and preserve them for undo.

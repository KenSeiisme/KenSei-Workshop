releaseName: KenSei Studio 0.8.0
releaseNotes: >
  ADDED

  - Import static PNG/JPEG images, crop, rotate and flip them, then generate
  editable hold-keyframe scans. Original images and settings travel with the
  project.

  - Preview linear sweeps and sword rotations from the actual generated pixels,
  with pivot, angle, direction and loop controls. POV imaging remains
  experimental and assumes constant motion.


  IMPROVED

  - Image scans respect the current ~30 FPS output, with 34 ms minimum column
  duration and bounded data size. Source metadata does not alter firmware
  identities.


  FIXED

  - Combined effect descriptions and animation into one edge-aware hover panel,
  removing the native tooltip that obscured the preview.

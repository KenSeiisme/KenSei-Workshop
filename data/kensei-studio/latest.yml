releaseName: KenSei Studio 0.7.0
releaseNotes: >
  ADDED

  - Drag the timeline playhead, ruler or waveform to seek, with edge scrolling
  and continuous audio during playback.


  IMPROVED

  - Simplified the library to 17 unique effects with uniform white/gray
  defaults, shared hover previews and four accurate categories. Existing clips
  and copied colors stay intact.

  - Smart paste finds the earliest complete space after the playhead, moving
  multi-track clips together without shortening or overwriting them. Repeated
  paste works without moving the playhead.


  FIXED

  - Gave the playback slider a 24 px control area and a fully visible 12 px
  thumb, including at both endpoints and different display scales.

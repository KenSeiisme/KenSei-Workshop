releaseName: KenSei Studio 0.6.0
releaseNotes: >
  ADDED

  - Multi-select clips with Ctrl-click, marquee selection or timeline Select
  All; copy and paste complete effects and pixel animations across tracks and
  songs.

  - Hover over an effect for 250 ms or focus it with the keyboard to preview it
  independently; clicking still adds it at the playhead.


  IMPROVED

  - New clips default to two beats, with beat and second duration presets saved
  in workspace preferences. New inserts and pastes use the exact playhead
  position regardless of snapping.

  - New effects shorten to the next clip or song end; pasted clips keep their
  complete duration, timing, track spacing, names, parameters and keyframes.
  Paste conflicts reject the whole batch.


  FIXED

  - Editor-only version updates retain the 0.5.0 firmware compatibility
  identity, so unchanged projects keep their existing firmware and build cache.
  Wireless synchronization remains a preview pending hardware validation.

releaseName: KenSei Studio 0.5.0
releaseNotes: >
  ADDED

  - Controller profiles, collapsible libraries, prop groups and eight-prop
  preview pages.

  - Preview wireless performance workspace with USB identity registration,
  preflight checks and blackout status.

  - Authenticated ESP-NOW controller and prop firmware, plus 64-node loss and
  clock-drift simulation.

  - Sequential build/upload queue and scheduled Web Audio playback with offset
  calibration.


  IMPROVED

  - Version 1 projects migrate in memory; the original file is backed up before
  saving version 2.

  - Live sessions lock editing, device jobs and update installation while cached
  prop programs keep running after disconnection.


  FIXED

  - Controller firmware and prop firmware are distinguished during build and
  hardware identity checks.

  - 64 props / indoor 30 m and physical timing accuracy remain unverified
  targets; wireless sync is a preview.

releaseName: KenSei Studio 0.9.2
releaseNotes: >
  ADDED

  - Performance preflight names the exact blocker, including the
  computer/controller clock requirement and a prop waiting for the selected
  show. Row status and main-process guards share the same checks.


  IMPROVED

  - Read available USB bytes immediately instead of waiting for a full 4096-byte
  read. Send idle-link clock/control lines without an intra-frame delay, while
  update data and control bursts retain receive-buffer protection.


  FIXED

  - Fixed ready props being accompanied by an unexplained performance-not-ready
  warning when USB latency inflated computer/controller clock uncertainty. The 8
  ms requirement remains enforced. Failed arming preserves the participant list.
  Existing migrated device firmware does not need reflashing; hardware
  synchronization remains a preview.

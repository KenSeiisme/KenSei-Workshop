releaseName: KenSei Studio 0.9.1
releaseNotes: >
  ADDED

  - Wireless progress now shows the current program/firmware object, chunk size
  and retry count. Timeout details include the byte offset and controller
  connection state.


  IMPROVED

  - Large-packet acknowledgement failures query the committed offset, then fall
  back to smaller chunks without restarting a valid transfer. Longer
  update-specific USB keepalive tolerates Flash erase and verification.


  FIXED

  - Paced and checked USB writes prevent full update frames from overflowing the
  existing 512-byte controller receive ring. Truncated binary frames
  resynchronize without swallowing the next valid reply. This App patch works
  with migrated 0.9.0 firmware; no additional USB reflash is required. Physical
  wireless reliability remains unverified.

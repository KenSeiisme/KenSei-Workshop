releaseName: KenSei Studio 0.9.0
releaseNotes: >
  ADDED

  - Update selected props through one USB-connected ESP-NOW controller. The
  preview includes per-device program transfer and paired application OTA, with
  capability checks, progress, cancellation, retry and version confirmation.

  - Independent binary programs retain parameters, beats and compressed
  pixel/image keyframes. Initial USB migration seeds two program banks alongside
  two rollback-capable application slots.


  IMPROVED

  - Program edits no longer rebuild migrated player firmware. Unchanged prop
  content is skipped; shared show changes block unsynced performance members.
  All uploads use a frozen project snapshot.

  - Transfer chunks authenticate sessions and offsets, verify CRC and
  whole-object SHA-256, and negotiate large or compatible small payloads. New
  firmware confirms health after ten seconds; program bank recovery is separate.


  FIXED

  - Wireless tasks now reserve the controller connection and prevent parallel
  flashing, performance arming, configuration deletion and App-update
  installation. Wireless reliability and power-loss recovery remain unverified
  on physical hardware.

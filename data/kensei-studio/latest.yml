releaseName: KenSei Studio 0.3.0
releaseNotes: >
  ADDED

  - Update Center with offline release history in English, Simplified Chinese
  and Traditional Chinese.

  - Check for updates at startup, then choose when to download and install.

  - Mouse wheel pans the timeline; Shift scrolls tracks and Ctrl zooms around
  the pointer.


  IMPROVED

  - Playback starts immediately from the playhead, with no preview countdown.

  - Updates save and restore the current workspace while preserving projects and
  build caches.

  - KenSei Workshop provides the Windows download and update feed.


  FIXED

  - Protected rapid play/pause and song changes from stale audio callbacks.

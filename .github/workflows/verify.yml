name: Workshop verification

on:
  push:
    branches: [preview, KenSei-Workshop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: pnpm format:check
      - name: Build static site
        run: python build.py
      - name: Check bilingual pages and messages
        run: pnpm test:i18n
      - name: Check build structure
        run: pnpm test:structure
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run isolated database tests
        run: pnpm test:database

<article class="container page-section project-detail">
  <a href="/projects/" class="back-link">← All projects</a>
  <div class="detail-heading">
    <div>
      <div class="eyebrow">${category} / PROJECT NOTES</div>
      <h1>${name}</h1>
      <p>${subtitle}</p>
    </div>
    <a
      class="button primary"
      ${car_attribute}
      href="${url}"
      target="_blank"
      rel="noopener"
      >${cta} ↗</a
    >
  </div>
  ${project_art}
  <p class="cover-note">${note}</p>
  <div class="detail-columns">
    <section>
      <h2>The idea</h2>
      <p>${overview}</p>
      <h2>What it explores</h2>
      <ul>
        ${highlights}
      </ul>
    </section>
    <aside class="panel">
      <div class="eyebrow">BUILT WITH</div>
      <p>${tech}</p>
      <div class="eyebrow">BY KENSEI</div>
      <p>Part of an ongoing collection of projects and experiments.</p>
    </aside>
  </div>
</article>

<article class="container page-section project-detail">
  <a href="/projects/" class="back-link"
    >${svg_back} <span>All projects</span></a
  >
  <div class="detail-heading glass-surface">
    <div>
      <div class="eyebrow">${category}</div>
      <h1>${name}</h1>
      <p>${subtitle}</p>
    </div>
    <a
      class="button primary"
      ${car_attribute}
      href="${url}"
      target="_blank"
      rel="noopener"
      ><span>${cta}</span> ${svg_external}</a
    >
  </div>
  <figure class="project-detail-cover">
    ${project_art}
    <figcaption class="cover-note">${note}</figcaption>
  </figure>
  <div class="detail-columns">
    <section>
      <h2>The idea</h2>
      <p>${overview}</p>
      <h2>What it explores</h2>
      <ul>
        ${highlights}
      </ul>
    </section>
    <aside class="panel">
      <h2>Built with</h2>
      <p>${tech}</p>
    </aside>
  </div>
</article>

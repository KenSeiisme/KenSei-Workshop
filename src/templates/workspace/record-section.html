<section class="workspace-section" id="workspace-${kind}">
  <h2>${title}</h2>
  <p id="${kind_2}-workspace-state" class="muted small" role="status"></p>
  <div id="${kind_3}-workspace-list" class="saved-list"></div>
  <div class="action-row">
    <button id="${kind_4}-workspace-more" class="text-link" hidden>
      Load more</button
    ><button id="${kind_5}-workspace-retry" class="text-link">Retry sync</button
    ><button id="${kind_6}-workspace-export" class="text-link">
      Export all ↓</button
    ><button id="${kind_7}-workspace-clear" class="text-link">Clear all</button
    ><a href="/tools/${slug}/" class="text-link">Open ${title_2} →</a>
  </div>
</section>

<dialog
  class="notice-center"
  id="notice-center"
  aria-labelledby="notice-center-title"
>
  <div class="notice-center-heading">
    <h2 id="notice-center-title">Notifications</h2>
    <button
      class="icon-button dialog-close"
      type="button"
      data-close-notices
      aria-label="Close notifications"
    >
      ${svg_close}
    </button>
  </div>
  <label class="field notice-filter"
    >Show notifications
    <select data-notice-filter>
      <option value="all">All</option>
      <option value="social">Social</option>
      <option value="rewards">Rewards</option>
    </select>
  </label>
  <details class="notice-settings">
    <summary>${svg_sound} <span>Notification sound</span></summary>
    <label for="notice-volume">Notification volume</label>
    <div class="notice-volume-row">
      <span data-notice-volume-icon aria-hidden="true">${svg_sound}</span>
      <input
        id="notice-volume"
        aria-label="Notification volume"
        type="range"
        min="0"
        max="100"
        step="1"
        value="25"
        data-notice-volume
      />
      <output for="notice-volume" data-notice-volume-value>25%</output>
    </div>
    <div class="notice-settings-actions">
      <button class="button secondary" type="button" data-test-notice-sound>
        Test sound
      </button>
      <button class="button secondary" type="button" data-mute-notices>
        Mute notifications
      </button>
    </div>
    <p
      class="muted small notice-audio-status"
      role="status"
      data-notice-sound-status
    ></p>
  </details>
  <div class="notice-center-actions">
    <button class="button secondary" type="button" data-notice-sign-in hidden>
      Sign in with Google
    </button>
    <button class="text-link" type="button" data-notice-read-all hidden>
      Mark all as read
    </button>
  </div>
  <p class="muted small" role="status" data-notice-status></p>
  <ol class="notice-list" data-notice-list></ol>
  <div class="notice-center-actions">
    <button class="button secondary" type="button" data-notice-more hidden>
      Load more
    </button>
    <button class="button secondary" type="button" data-notice-retry hidden>
      Retry
    </button>
  </div>
</dialog>

<a
  class="home-card"
  data-home-card="${slug}"
  ${accent}
  href="${url}"
  aria-labelledby="home-card-${slug}"
>
  <div class="home-card-cover" data-home-cover>${art}</div>
  <div class="home-card-copy">
    <h3 id="home-card-${slug}">${name}</h3>
    <p>${description}</p>
    ${tags}
  </div>
  ${svg_arrow}
</a>

<a class="skip-link" href="#main">Skip to content</a>
<header class="header">
  <div class="container nav-wrap">
    <a class="brand" href="/" aria-label="KenSei home"
      ><span class="brand-symbol">k<span>✳</span></span
      >KenSei<span class="brand-dot">.</span></a
    >
    <nav aria-label="Main navigation" id="navigation">
      ${nav}<a
        data-personal
        href="https://kensei-eta.vercel.app/"
        target="_blank"
        rel="noopener"
        ><span>About Me</span> ${svg_external}</a
      >
    </nav>
    <button
      type="button"
      class="icon-button site-search-button"
      aria-label="Search the site"
      aria-haspopup="dialog"
      hidden
    >
      ${svg_search}
      <span class="site-search-caption" aria-hidden="true">
        <span class="site-search-wide"></span>
        <span class="site-search-compact"></span>
      </span>
    </button>
    <div class="site-account-group">
      <button
        type="button"
        class="icon-button site-notice-trigger"
        data-open-notices
        aria-label="Notifications"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="notice-center"
        hidden
      >
        ${svg_bell}<span data-notice-count hidden aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="icon-button site-theme"
        data-site-theme-toggle
        aria-label="Switch to light theme"
        title="Switch to light theme"
      >
        ${sun}${moon}
      </button>
      <div class="account-controls" id="account-controls">
        <button
          class="sign-button"
          data-sign-in
          id="account-toggle"
          aria-expanded="false"
          aria-controls="account-menu"
        >
          <span class="user-dot"></span
          ><span
            class="avatar-badge avatar-small"
            data-account-avatar
            hidden
          ></span
          ><span data-auth-label>Sign in</span
          ><span data-account-external>${svg_external}</span
          ><span data-account-chevron hidden>${svg_chevron}</span>
        </button>
        <div class="account-menu" id="account-menu" hidden>
          <a href="/workspace/">Workspace</a><a href="/profile/">My Profile</a
          ><a href="/friends/">Friends</a
          ><a href="/profile/" id="account-public-profile" hidden
            >Public Profile</a
          ><button id="account-sign-out">Sign out</button>
        </div>
      </div>
    </div>
    <template data-language-icon>${svg_globe}</template>
    <button
      class="menu-toggle icon-button"
      aria-label="Toggle navigation"
      aria-controls="navigation"
      aria-expanded="false"
    >
      ${svg_menu}
    </button>
  </div>
</header>

<a class="skip-link" href="#main">Skip to content</a>
<header class="header">
  <div class="container nav-wrap">
    <a class="brand" href="/" aria-label="KenSei home"
      ><span class="brand-symbol">k<span>✳</span></span
      >KenSei<span class="brand-dot">.</span></a
    >
    <nav aria-label="Main navigation" id="navigation">
      ${nav}<a
        data-personal
        href="https://kensei-eta.vercel.app/"
        target="_blank"
        rel="noopener"
        >About Me <span class="external-mark">↗</span></a
      >
    </nav>
    <button
      type="button"
      class="icon-button site-theme"
      data-site-theme-toggle
      aria-label="Switch to light theme"
      title="Switch to light theme"
    >
      <svg
        data-theme-sun
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
        />
      </svg>
      <svg
        data-theme-moon
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"
        aria-hidden="true"
        hidden
      >
        <path d="M20 15a8 8 0 0 1-11-11 8.5 8.5 0 1 0 11 11Z" />
      </svg>
    </button>
    <div class="account-controls" id="account-controls">
      <button
        class="sign-button"
        data-sign-in
        id="account-toggle"
        aria-expanded="false"
        aria-controls="account-menu"
      >
        <span class="user-dot"></span
        ><span
          class="avatar-badge avatar-small"
          data-account-avatar
          hidden
        ></span
        ><span data-auth-label>Sign in</span><span data-account-chevron>↗</span>
      </button>
      <div class="account-menu" id="account-menu" hidden>
        <a href="/workspace/">Workspace</a><a href="/profile/">My Profile</a
        ><a href="/profile/" id="account-public-profile" hidden
          >Public Profile</a
        ><button id="account-sign-out">Sign out</button>
      </div>
    </div>
    <button
      class="menu-toggle icon-button"
      aria-label="Toggle navigation"
      aria-controls="navigation"
      aria-expanded="false"
    >
      ☰
    </button>
  </div>
</header>

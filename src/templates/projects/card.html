<article
  class="project-card ${content}"
  data-category="${lower}"
  data-project="${slug}"
>
  <a
    href="/projects/${slug}/"
    class="project-card-link"
    aria-labelledby="project-card-${slug}"
  >
    <div class="project-cover">${project_art}</div>
    <div class="project-copy">
      <div class="eyebrow">${cat}</div>
      <div class="project-title">
        <h3 id="project-card-${slug}">${name}</h3>
        ${svg_arrow}
      </div>
      <p>${desc}</p>
      <span class="stack-label">${stack}</span>
    </div>
  </a>
</article>

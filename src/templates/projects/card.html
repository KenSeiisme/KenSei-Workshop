<article class="project-card ${content}" data-category="${lower}">
  <a
    href="/projects/${slug}/"
    class="project-cover"
    aria-label="Explore ${name}"
    >${project_art}</a
  >
  <div class="project-copy">
    <div class="eyebrow">${cat} <span>PROJECT</span></div>
    <a class="project-title" href="/projects/${slug_2}/"
      ><h3>${name_2}</h3>
      <span>↗</span></a
    >
    <p>${desc}</p>
    <span class="stack-label">${stack}</span>
  </div>
</article>

<section id="image-steps-mode" class="panel tool-form steps-tool" hidden>
  <div class="form-row">
    <label
      >Screenshots<input
        id="steps-files"
        type="file"
        multiple
        accept="image/jpeg,image/png,image/webp"
    /></label>
    <label
      >Layout<select id="steps-layout">
        <option value="stack">Vertical steps</option>
        <option value="compare">Two-column comparison</option>
      </select></label
    >
    <label
      >Output width (px)<input
        id="steps-width"
        type="number"
        value="1200"
        min="320"
        max="2400"
        step="1"
    /></label>
  </div>
  <p class="muted small">
    Choose up to six screenshots. Screenshots and annotations stay in this tab.
  </p>
  <ol class="steps-list" id="steps-files-list"></ol>
  <div class="steps-editor" id="steps-editor" hidden>
    <div class="action-row">
      <button class="button secondary" id="steps-earlier">Move earlier</button>
      <button class="button secondary" id="steps-later">Move later</button>
      <button class="button secondary" id="steps-undo">Undo annotation</button>
      <button class="button secondary" id="steps-remove">
        Remove screenshot
      </button>
    </div>
    <div class="form-row">
      <label
        >Annotation<select id="steps-type">
          <option value="number">Number</option>
          <option value="arrow">Arrow</option>
          <option value="text">Short text</option>
          <option value="cover">Solid cover</option>
        </select></label
      >
      <label id="steps-value-field"
        >Number or text<input
          id="steps-value"
          type="text"
          maxlength="60"
          value="1"
      /></label>
    </div>
    <p id="steps-instructions" class="small muted"></p>
    <canvas
      id="steps-image"
      aria-label="Screenshot annotation preview"
    ></canvas>
    <details id="steps-coordinates">
      <summary>Place using coordinates</summary>
      <div class="form-row">
        <label
          >Start X (%)<input
            id="steps-x"
            type="number"
            min="0"
            max="100"
            value="25"
        /></label>
        <label
          >Start Y (%)<input
            id="steps-y"
            type="number"
            min="0"
            max="100"
            value="25"
        /></label>
      </div>
      <div class="form-row" id="steps-end">
        <label
          >End X (%)<input
            id="steps-end-x"
            type="number"
            min="0"
            max="100"
            value="75"
        /></label>
        <label
          >End Y (%)<input
            id="steps-end-y"
            type="number"
            min="0"
            max="100"
            value="60"
        /></label>
      </div>
      <button class="button secondary" id="steps-place">
        Place annotation
      </button>
    </details>
  </div>
  <p id="steps-status" class="muted small" role="status"></p>
  <div class="action-row">
    <button class="button primary" id="steps-preview" disabled>
      Prepare preview
    </button>
    <button class="button secondary" id="steps-cancel" hidden>Cancel</button>
  </div>
  <div id="steps-result" hidden>
    <div class="action-row">
      <button class="button primary" id="steps-download">Download PNG</button>
    </div>
    <div id="steps-transfer"></div>
    <img id="steps-composite" alt="Final screenshot composition" />
  </div>
</section>

<div id="image-edit-mode" hidden>
  <div class="studio-grid">
    <section class="panel tool-form">
      <h2>A crop, a turn, a personal touch</h2>
      <label
        >Image<input
          id="edit-file"
          type="file"
          accept="image/jpeg,image/png,image/webp"
      /></label>
      <p class="muted small">
        One JPG / PNG / WebP · 20 MB · 40 megapixels. Edit state stays on this
        page and is excluded from saved presets.
      </p>
      <div id="edit-cropper" class="edit-cropper"></div>
      <div class="action-row">
        <button id="edit-rotate" class="button secondary">Rotate 90°</button
        ><button id="edit-flip-x" class="button secondary">
          Flip horizontal</button
        ><button id="edit-flip-y" class="button secondary">Flip vertical</button
        ><button id="edit-reset" class="text-link">Reset transform</button>
      </div>
      <label
        >Crop ratio<select id="edit-ratio">
          <option value="free">Free</option>
          <option value="1">1:1</option>
          <option value="1.3333333333">4:3</option>
          <option value="1.7777777778">16:9</option>
          <option value="0.5625">9:16</option>
        </select></label
      >
    </section>
    <section class="panel tool-form">
      <h2>Your output</h2>
      <div class="form-row">
        <label
          >Width<input
            id="edit-width"
            type="number"
            min="1"
            max="12000" /></label
        ><label
          >Height · crop ratio locked<input id="edit-height" readonly
        /></label>
      </div>
      <label
        >Format<select id="edit-format">
          <option value="image/webp">WebP</option>
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG · white background</option>
        </select></label
      ><label
        >Quality<input
          id="edit-quality"
          type="range"
          min="10"
          max="100"
          value="85" /></label
      ><label
        >Text watermark (optional)<input
          id="edit-watermark"
          maxlength="100" /></label
      ><label
        >Position<select id="edit-position">
          <option value="bottom-right">Bottom right</option>
          <option value="center">Center</option>
          <option value="top-left">Top left</option>
        </select></label
      >
      <div class="form-row">
        <label
          >Color<input id="edit-color" type="color" value="#ffffff" /></label
        ><label
          >Opacity<input
            id="edit-opacity"
            type="range"
            min="0"
            max="100"
            value="70"
        /></label>
      </div>
      <label
        >Text size · % of shorter side<input
          id="edit-font-size"
          type="range"
          min="1"
          max="20"
          value="5" /></label
      ><button id="edit-run" class="button primary" disabled>
        Preview edit →
      </button>
      <p id="edit-status" class="muted small" role="status">
        Choose an image to edit. Nothing uploads.
      </p>
      <img
        id="edit-preview"
        class="edited-preview"
        alt="Actual exported image preview"
        hidden
      /><button id="edit-download" class="button secondary" disabled>
        Download edit ↓
      </button>
    </section>
  </div>
</div>

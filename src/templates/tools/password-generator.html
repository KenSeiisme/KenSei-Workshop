<div class="panel tool-form converter-panel">
  <h2>A fresh password, just for you.</h2>
  <label
    >Password length (8–64)<input
      id="password-length"
      type="number"
      min="8"
      max="64"
      value="20"
  /></label>
  <fieldset class="password-options">
    <legend>Characters to include</legend>
    <label class="check-label"
      ><input id="password-upper" type="checkbox" checked />Uppercase A–Z</label
    ><label class="check-label"
      ><input id="password-lower" type="checkbox" checked />Lowercase a–z</label
    ><label class="check-label"
      ><input id="password-digits" type="checkbox" checked />Numbers 0–9</label
    ><label class="check-label"
      ><input id="password-symbols" type="checkbox" checked />Symbols</label
    ><label class="check-label"
      ><input id="password-ambiguous" type="checkbox" />Exclude look-alike
      characters (I, l, 1, O, 0)</label
    >
  </fieldset>
  <label
    >Your password<input
      id="password-output"
      class="password-output"
      readonly
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
  /></label>
  <div class="action-row">
    <button id="password-generate" class="button primary">Generate again</button
    ><button id="password-copy" class="button secondary">Copy password</button>
  </div>
  <p id="password-status" class="muted small" role="status"></p>
  <p class="muted small">
    Generated using your browser's cryptographic random source. Never saved or
    uploaded. Copy it to your own password manager; copying places it on your
    device clipboard.
  </p>
</div>

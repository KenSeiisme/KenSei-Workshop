<a href="/tools/" class="back-link">← All tools</a>
<div class="tool-page-heading tool-heading">
  <div>
    <div class="eyebrow">${category} / YOUR EVERYDAY TOOLBOX</div>
    <h1>${name}</h1>
    <p>${description}</p>
  </div>
  <div class="tool-heading-actions">
    <button
      data-favorite="${slug}"
      class="button secondary favorite"
      aria-pressed="false"
    >
      ${star} Favorite</button
    ><button class="button secondary" data-open-help aria-haspopup="dialog">
      Help &amp; limits
    </button>
  </div>
</div>
<dialog class="tool-help-dialog" id="tool-help">
  <button class="button secondary" data-close-help aria-label="Close help">
    Close ×
  </button>
  <h2>${name}</h2>
  <h3>Limits &amp; requirements</h3>
  <p>${limits}</p>
  <h3>How it works</h3>
  <p>${usage}</p>
  <h3>Saving &amp; privacy</h3>
  <p>${privacy}</p>
</dialog>
<div
  class="tool-feedback"
  data-state="ready"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  <span class="tool-state-label">Ready</span>
  <p class="tool-state-message">${privacy}</p>
</div>

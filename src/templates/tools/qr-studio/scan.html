<section
  id="qr-scan-panel"
  class="panel tool-form"
  role="tabpanel"
  aria-labelledby="qr-scan-tab"
  hidden
>
  <h2>Read a QR code</h2>
  <p class="muted small">
    Scan a local image or use your camera. Results stay on this page and are
    never saved.
  </p>
  <label
    >QR image<input
      id="qr-scan-file"
      type="file"
      accept="image/png,image/jpeg,image/webp"
  /></label>
  <p class="muted small">
    JPG, PNG or WebP · up to 20 MB and 40 megapixels · one QR result per scan.
  </p>
  <div class="action-row">
    <label class="compact-label"
      >Camera<select id="qr-camera-facing">
        <option value="environment">Back camera</option>
        <option value="user">Front camera</option>
      </select></label
    ><button id="qr-camera-start" class="button secondary">Start camera</button
    ><button id="qr-camera-stop" class="button secondary" disabled>
      Stop camera
    </button>
  </div>
  <video
    id="qr-camera-video"
    class="capture-video"
    muted
    playsinline
    hidden
  ></video>
  <p id="qr-scan-status" class="muted small" role="status" aria-live="polite">
    Choose an image, or start your camera.
  </p>
  <label
    >Decoded content<textarea
      id="qr-scan-result"
      readonly
      class="copy-output"
      spellcheck="false"
    ></textarea>
  </label>
  <div class="action-row">
    <button id="qr-scan-copy" class="button secondary" disabled>
      Copy result</button
    ><a
      id="qr-scan-open"
      class="button secondary"
      target="_blank"
      rel="noopener noreferrer"
      hidden
      >Open website ↗</a
    ><button id="qr-scan-clear" class="text-link">Clear result</button>
  </div>
</section>

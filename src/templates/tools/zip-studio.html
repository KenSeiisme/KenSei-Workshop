<div class="studio-grid">
  <section class="panel tool-form">
    <h2>Pack your files</h2>
    <label
      >Files to pack<input id="zip-files" type="file" multiple data-lock
    /></label>
    <p class="muted small">
      Up to 100 files · 100 MB total. Original file names are kept; duplicate
      names receive a suffix.
    </p>
    <div id="zip-selected" class="file-summary"></div>
    <label
      >Archive name<input
        id="zip-name"
        value="kensei-files.zip"
        maxlength="100"
        data-lock /></label
    ><button id="zip-pack" class="button primary" data-lock>
      Create ZIP & download ↓
    </button>
  </section>
  <section class="panel tool-form">
    <h2>Look inside a ZIP</h2>
    <label
      >ZIP archive<input
        id="zip-open"
        type="file"
        accept=".zip,application/zip"
        data-lock
    /></label>
    <p class="muted small">
      100 MB archive · 2,000 entries · 500 MB total expanded content. Encrypted,
      unsupported and damaged archives are rejected.
    </p>
    <div id="zip-entries" class="zip-entries"></div>
  </section>
</div>
<div class="job-status">
  <p id="tool-status" role="status" class="muted small" aria-live="polite">
    Files stay on this device.
  </p>
  <button id="cancel-job" class="button secondary" hidden>Cancel</button>
</div>
<progress
  id="zip-progress"
  max="100"
  value="0"
  aria-label="Archive progress"
></progress>

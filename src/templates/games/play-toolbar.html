<div class="game-page-heading game-shell-toolbar">
  <a class="back-link" href="/games/" aria-label="Back to Games"
    >← <span>Games</span></a
  >
  <h1>${name}</h1>
  <button
    class="game-shell-mode"
    type="button"
    data-shell-setup
    aria-label="Game setup"
  >
    <span data-shell-mode>Ready to play</span><span aria-hidden="true">⌄</span>
  </button>
  <div class="game-heading-tools">
    <a
      class="button secondary game-achievement-link"
      href="/games/achievements/"
      aria-label="Achievements"
      title="Achievements"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <circle cx="12" cy="9" r="5" />
        <path d="m9 13-2 8 5-2 5 2-2-8m-5-4 1.5 1.5L14 8" /></svg
      ><span>Achievements</span>
    </a>
    <button
      type="button"
      class="icon-button game-shell-sound"
      id="${sound_id}"
      data-audio-toggle
      aria-pressed="true"
    >
      Sound on
    </button>
    <button type="button" class="button secondary" data-shell-settings>
      Settings
    </button>
    <button type="button" class="button secondary" data-shell-focus hidden>
      Exit focus
    </button>
  </div>
</div>

<div class="game-page-heading game-shell-toolbar">
  <a class="back-link" href="/games/" aria-label="Back to Games"
    >${svg_back} <span>Games</span></a
  >
  <h1>${name}</h1>
  <button
    class="game-shell-mode"
    type="button"
    data-shell-setup
    aria-label="Game setup"
  >
    <span data-shell-mode>Ready to play</span>${svg_chevron}
  </button>
  <div class="game-heading-tools">
    <a
      class="button secondary game-achievement-link"
      href="/games/achievements/"
      aria-label="Achievements"
      title="Achievements"
    >
      ${svg_achievement}<span>Achievements</span>
    </a>
    <button
      type="button"
      class="icon-button game-shell-sound"
      id="${sound_id}"
      data-audio-toggle
      aria-pressed="true"
      aria-label="Sound"
      title="Sound on"
    >
      <span class="sound-icon-on">${svg_sound}</span>
      <span class="sound-icon-off">${svg_mute}</span>
      <span data-audio-label class="sr-only">Sound on</span>
    </button>
    <button
      type="button"
      class="button secondary"
      data-shell-settings
      aria-label="Settings"
      title="Settings"
    >
      ${svg_settings} <span>Settings</span>
    </button>
    <button type="button" class="button secondary" data-shell-focus hidden>
      ${svg_focus} <span data-shell-focus-label>Exit focus</span>
    </button>
  </div>
</div>

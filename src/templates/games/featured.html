<article
  class="hub-slide"
  data-hub-featured="${slug}"
  data-game-theme="${slug}"
  role="group"
  aria-roledescription="slide"
  aria-labelledby="featured-${slug}"
  ${hidden}
>
  <div class="hub-slide-copy">
    <div class="hub-tags">${play_tags}</div>
    <h2 id="featured-${slug}">${name}</h2>
    <p>${description}</p>
    <dl class="hub-feature-stats">
      <div>
        <dt data-hub-best-label>My best</dt>
        <dd data-hub-best>—</dd>
      </div>
      <div>
        <dt>Games started</dt>
        <dd data-hub-plays>—</dd>
      </div>
    </dl>
    <div class="hub-feature-actions">
      <a class="button primary" href="/games/${slug}/"
        >Play game <span aria-hidden="true">↗</span></a
      >
      <a class="button secondary" href="/games/leaderboards/?game=${slug}"
        >View leaderboard</a
      >
    </div>
  </div>
  <div class="game-cover hub-slide-art" aria-hidden="true">${preview}</div>
</article>

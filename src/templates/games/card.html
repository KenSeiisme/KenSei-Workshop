<article
  class="game-card"
  data-game-card
  data-game-theme="${slug}"
  data-category="${category_key}"
  data-search="${search_text}"
>
  <a
    href="/games/${slug}/"
    class="game-card-link"
    aria-labelledby="game-card-title-${slug}"
  >
    <div class="game-cover" aria-hidden="true">
      ${preview}<span class="small-tag">${category}</span>
      <span class="game-demo-label">DEMO PREVIEW</span>
    </div>
    <div class="game-card-copy">
      <h3 id="game-card-title-${slug}">${name}</h3>
      <p>${description}</p>
      <div class="game-card-meta">
        <span>${spec}</span><span>${play_mode}</span>
      </div>
      <p class="hub-card-stats muted small" data-hub-card-stats></p>
      <span class="game-card-play" aria-hidden="true">
        <span>Play game</span> ${svg_arrow}
      </span>
    </div>
  </a>
</article>

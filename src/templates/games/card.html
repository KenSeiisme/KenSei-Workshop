<article
  class="game-card"
  data-game-card
  data-game-theme="${slug}"
  data-category="${category_key}"
  data-search="${search_text}"
>
  <div class="game-cover" aria-hidden="true">
    <span class="game-card-number">${station}</span>${preview}<span
      class="small-tag"
      >${category}</span
    ><span class="game-demo-label">DEMO PREVIEW</span>
  </div>
  <div class="game-card-copy">
    <p class="game-card-kicker">${tagline}</p>
    <h2><a href="/games/${slug}/" class="card-primary-link">${name}</a></h2>
    <p>${description}</p>
    <div class="game-card-meta">
      <span>${spec}</span><span>${play_mode}</span>
    </div>
    <span class="game-card-play" aria-hidden="true"
      >Play game <span>↗</span></span
    >
  </div>
</article>

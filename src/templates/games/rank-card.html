<a
  class="hub-rank-card"
  data-rank-game="${slug}"
  data-game-theme="${slug}"
  href="/games/leaderboards/?game=${slug}"
>
  <div class="rank-card-cover game-cover" aria-hidden="true">
    <div class="rank-card-illustration">${preview}</div>
    <span class="rank-card-selected">${svg_tick}</span>
  </div>
  <span class="rank-card-label"
    ><strong>${name}</strong><small>${category}</small></span
  >
</a>
